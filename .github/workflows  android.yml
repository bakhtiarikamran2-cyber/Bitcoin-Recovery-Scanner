
name: workflows/android.yml

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: |
          unzip -q Bitcoin_Recovery_Scanner_Android_Source.zip -d .

      - name: Build Android APK
        working-directory: bitcoin_recovery_scanner
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Recovery-Scanner-APK
          path: bitcoin_recovery_scanner/app/build/outputs/apk/debug/app-debug.apk
